name: rls
on: [push, pull_request]
jobs:
  suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client
      - run: ./run.sh --local
        env: { PGPASSWORD: postgres }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=dev --no-audit --no-fund
      - name: checker finds nothing on the example schema
        run: node bin/check.mjs postgresql://postgres:postgres@localhost:5432/rls_harness
      - name: checker catches an open table
        run: |
          psql postgresql://postgres:postgres@localhost:5432/rls_harness -c "CREATE TABLE public.leaky (id int);"
          if node bin/check.mjs postgresql://postgres:postgres@localhost:5432/rls_harness; then echo "should have failed"; exit 1; fi
